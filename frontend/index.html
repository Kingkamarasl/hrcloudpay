    <!--
      Both icons point at fixed paths served by Django, not at files bundled here.
      A platform administrator can therefore replace the site icon from the
      console and it takes effect on the next page load, with no frontend rebuild
      and no redeploy. These routes answer 204 until something is uploaded, which
      browsers treat as "no icon" rather than an error.
    -->
    <link rel="icon" type="image/png" href="/site-icon/favicon.png">
    <link rel="apple-touch-icon" href="/site-icon/apple-touch-icon.png">
  </head>
