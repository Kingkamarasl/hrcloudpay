name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

# A newer push makes the older run irrelevant.  Cancelling it frees the hosted
# runner and gives reviewers the result for the commit they can actually merge.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: hrcloudpay_test
          POSTGRES_USER: hrcloudpay
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      # Two marketing-editor guards shell out to Node to run the frontend
      # source through a parser. Without it they died in setUpClass with
      # FileNotFoundError: 'node' - which reads like a broken test rather than
      # a missing runtime.
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Build frontend for backend integration tests
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Run Django checks
        run: |
          cd backend
          python manage.py check
        env:
          DATABASE_URL: postgres://hrcloudpay:test_password@localhost:5432/hrcloudpay_test
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: ci-test-secret-key
          DEBUG: 'False'
          # There is no TLS-terminating proxy in CI, so SECURE_SSL_REDIRECT
          # would 301 every request the test client makes. Everything else
          # stays at its production value, so the suite still exercises the
          # DEBUG-off configuration rather than a softened one.
          SECURE_SSL_REDIRECT: 'False'

      - name: Run migrations
        run: |
          cd backend
          python manage.py migrate --noinput
        env:
          DATABASE_URL: postgres://hrcloudpay:test_password@localhost:5432/hrcloudpay_test
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: ci-test-secret-key
          DEBUG: 'False'
          # There is no TLS-terminating proxy in CI, so SECURE_SSL_REDIRECT
          # would 301 every request the test client makes. Everything else
          # stays at its production value, so the suite still exercises the
          # DEBUG-off configuration rather than a softened one.
          SECURE_SSL_REDIRECT: 'False'

      - name: Run tests
        run: |
          cd backend
          python manage.py test --verbosity=2
        env:
          DATABASE_URL: postgres://hrcloudpay:test_password@localhost:5432/hrcloudpay_test
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: ci-test-secret-key
          DEBUG: 'False'
          # There is no TLS-terminating proxy in CI, so SECURE_SSL_REDIRECT
          # would 301 every request the test client makes. Everything else
          # stays at its production value, so the suite still exercises the
          # DEBUG-off configuration rather than a softened one.
          SECURE_SSL_REDIRECT: 'False'

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      # Vite builds with esbuild, which strips types without checking them.
      # Without this step a type error reaches main unnoticed and only surfaces
      # on the next `npm run typecheck`, by which point it is someone's bug.
      - name: Typecheck
        run: |
          cd frontend
          npm run typecheck

      - name: Run frontend tests
        run: |
          cd frontend
          npm run test:run

      - name: Audit production frontend dependencies
        run: |
          cd frontend
          npm audit --omit=dev --audit-level=high

      - name: Build
        run: |
          cd frontend
          npm run build

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install security tools
        run: |
          pip install bandit pip-audit

      # High-severity static-analysis findings are a merge blocker.  Lower
      # severities remain visible to local scanners without turning known,
      # reviewed framework patterns into permanent red builds.
      - name: Block high-severity Python security findings
        run: |
          cd backend
          bandit -r . -lll

      # pip-audit resolves the declared requirements and fails when a published
      # vulnerability has a known fix, making dependency risk actionable in CI.
      - name: Audit Python dependencies
        run: |
          pip-audit -r backend/requirements.txt
